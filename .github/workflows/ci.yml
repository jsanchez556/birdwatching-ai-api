name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, build, and verify chat contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production output
        run: npm run build

      - name: Checkout UI contract consumer
        uses: actions/checkout@v4
        with:
          repository: jsanchez556/birdwatching-ai-ui
          ref: main
          path: contract-ui
          persist-credentials: false

      - name: Verify streamed chat contract
        run: node contract-ui/scripts/test-chat-contract.js --api-root .

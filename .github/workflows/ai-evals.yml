name: AI Evaluations

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ai-evals:
    name: Run AI evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run synthetic scorer self-test
        run: npm run ai:evals:self-test

      - name: Require real pipeline output artifact
        env:
          AI_EVAL_RESULTS_FILE: ${{ vars.AI_EVAL_RESULTS_FILE }}
        run: |
          if [ -z "$AI_EVAL_RESULTS_FILE" ] || [ ! -f "$AI_EVAL_RESULTS_FILE" ]; then
            echo "A repository-relative AI_EVAL_RESULTS_FILE from a staging or production-like pipeline run is required."
            exit 1
          fi
          npm run ai:evals -- --results "$AI_EVAL_RESULTS_FILE"

      - name: Upload AI evaluation results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ai-eval-results
          path: |
            tmp/ai-eval-results.json
            tmp/ai-scorer-self-test-results.json
          if-no-files-found: ignore
